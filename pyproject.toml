[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gachon-p-practice-dms"
version = "0.3.0"
description = "Gachon P-Practice real-time RGB driver monitoring demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
vision = ["mediapipe==0.10.35", "opencv-contrib-python==4.13.0.92", "numpy==2.2.6"]
action = ["torch==2.9.1", "torchvision==0.24.1", "Pillow>=11,<14"]

[project.scripts]
dms-demo = "dms.__main__:main"
dms-live = "dms.live:main"

[tool.setuptools.packages.find]
where = ["src"]
