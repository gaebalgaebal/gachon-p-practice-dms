name: DMS demo checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install core package
        run: python -m pip install -e .
      - name: Test temporal rules and split validation
        run: python -m unittest discover -s tests -v
      - name: Replay synthetic features
        run: python -m dms --input examples/synthetic_features.csv --output runs/demo.jsonl
      - name: Validate synthetic manifest
        run: python scripts/validate_manifest.py examples/synthetic_manifest.csv

  vision:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux MediaPipe runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgles2 libgl1
      - name: Install actual vision stack
        run: python -m pip install -e ".[vision]"
      - name: Download and verify official face model
        run: python scripts/download_model.py
      - name: Test geometry, calibration and temporal rules
        run: python -m unittest discover -s tests -v
      - name: Run actual MediaPipe video integration
        run: python scripts/integration_smoke.py

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install optional action adapter
        run: python -m pip install -e ".[vision,action]"
      - name: Verify training path and reject smoke weights in live demo
        run: python scripts/action_smoke.py
